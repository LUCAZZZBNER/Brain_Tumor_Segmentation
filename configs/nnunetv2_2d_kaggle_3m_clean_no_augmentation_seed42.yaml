# Official nnU-Net v2 2D baseline wrapper.
# nnUNetTrainerNoDA disables training-time data augmentation. Architecture,
# preprocessing, patch size, normalization, and schedule remain nnU-Net planned.
project:
  name: nnunetv2_2d_kaggle_3m_clean_no_augmentation
  seed: 42
  output_dir: runs/nnunetv2_2d_kaggle_3m_clean_no_augmentation_seed42

data:
  root: DATASET/kaggle_3m
  manifest: splits/kaggle_3m_multimodal_only_seed42.csv
  split_metadata: splits/kaggle_3m_multimodal_only_seed42.meta.json
  channel_names: [pre_contrast, FLAIR, post_contrast]
  file_ending: .png

nnunet:
  dataset_id: 501
  dataset_name: Kaggle3MClean
  configuration: 2d
  fold: 0
  trainer: nnUNetTrainerNoDA
  plans: nnUNetPlans
  checkpoint: checkpoint_best.pth
  device: cuda
  # Resource-only overrides. They do not alter the model, samples, seed, or
  # augmentation policy. The planner's batch size (49 here) is retained in the
  # saved plans but overridden in memory by the seeded training wrapper.
  batch_size: 4
  num_data_workers: 0
  num_export_workers: 1

evaluation:
  threshold: 0.5
  primary: positive_macro_iou
