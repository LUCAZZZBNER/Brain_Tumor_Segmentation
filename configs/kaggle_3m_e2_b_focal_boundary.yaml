# E2 = E0 + B, where B is the focal-boundary objective for hard pixels and small edges.
project:
  name: kaggle_3m_e2_b_focal_boundary
  seed: 42
  output_dir: runs/kaggle_3m_e2_b_focal_boundary_seed42

data:
  root: DATASET/kaggle_3m
  manifest: splits/kaggle_3m_seed42.csv
  split_metadata: splits/kaggle_3m_seed42.meta.json
  group_csv: null
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  image_size: [256, 256]
  channel_mode: flair_green
  normalization:
    mean: 0.5
    std: 0.5
  batch_size: 4
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  verify_file_hashes: true
  balance_empty_masks: true
  positive_sampling_fraction: 0.40
  augmentation:
    horizontal_flip_probability: 0.5
    rotation_degrees: 5.0

model:
  name: unet
  encoder: double_conv
  in_channels: 1
  out_channels: 1
  base_channels: 32
  batch_norm: false
  dropout: 0.0

loss:
  name: dice_focal_boundary
  dice_weight: 0.55
  focal_weight: 0.30
  boundary_weight: 0.15
  smooth: 1.0
  focal_alpha: 0.75
  focal_gamma: 2.0
  boundary_kernel_size: 3

optimizer:
  name: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001

scheduler:
  name: reduce_on_plateau
  factor: 0.5
  patience: 8
  min_learning_rate: 0.000001

training:
  epochs: 150
  gradient_clip_norm: 1.0
  amp: true
  deterministic: true
  early_stopping_patience: 30
  resume: null

metrics:
  threshold: 0.5
  primary: positive_macro_iou

evaluation:
  split: val
  save_predictions: true
  save_probability_maps: true
  save_comparison_figures: true
  max_saved_predictions: null
